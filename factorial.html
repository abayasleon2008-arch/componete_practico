<script>
    let num = prompt("Ingrese un número para calcular su factorial:");
    let factorial = 1;
    num = Number(num);
    while (num > 1) {
        factorial *= num;
        num--;
    }
    console.log("El factorial es: " + factorial);
    document.write("<h1>El factorial es: " + factorial + "</h1>");
</script>
