<script>
  let Elc = Number(prompt(
        "[1] Para mostrar los primeros 4 números perfectos\n" +
        "[2] Para saber si el número ingresado es perfecto"
    ));
    switch (Elc) {
        case 1:
        //estto es un ejempli
            let contador = 0;
            let N = 1;
            while (contador < 4) {
                let suma = 0;
                for (let i = 1; i < N; i++) {

                    if (N % i == 0) {
                        suma = suma + i;
                    }
                }
                if (suma == N) {
                    document.write(N + "<br>");
                    contador++;
                }
                N++;
            }
            break;
        
  
</script>
