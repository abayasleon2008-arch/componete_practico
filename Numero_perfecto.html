
<script>
  let Elc = Number(prompt(
        "[1] Para mostrar los primeros 4 números perfectos\n" +
        "[2] Para saber si el número ingresado es perfecto"
    ));
    switch (Elc) {
        case 1:
        //estto es un ejempli
            let contador = 0;
            let N = 1;
            while (contador < 4) {
                let suma = 0;
                for (let i = 1; i < N; i++) {

                    if (N % i == 0) {
                        suma = suma + i;
                    }
                }
                if (suma == N) {
                    document.write(N + "<br>");
                    contador++;
                }
                N++;
            }
            break;
      case 2: //Esta es la opción dos, que el usuario utilizara para comprobar si el número es perfecto
           let numero = Number(prompt( 
                "Ingrese un número para comprobar si es perfecto:" //Definir y leer variable
            ));
            let sumaDivisores = 0;//Definir variable
            for (let i = 1; i < numero; i++) { //Condición Para
                if (numero % i == 0) { //Condición Si entonces
                    sumaDivisores = sumaDivisores + i;
                }//Fin Si
            }
            if (numero > 0 && sumaDivisores == numero) {//Condición Si entonces
                document.write(numero + " es un número perfecto");//Salida por pantalla
            } else { //Condición Si entonces por falso
                document.write(numero + " no es un número perfecto"); //Salida por pantalla
            } //fin Si
            break; //Salida del case
        default://Incica que se debe hacer cuando la opción no es correcta
            document.write("El número ingresado no se encuentra entre los parámetros");//Salida por pantalla
    }
        
</script>
