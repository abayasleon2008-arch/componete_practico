<script>
     let a = 0;
     let contador = 0;
     let b = 1;  
     let fib = 0;
     let primos = 0;
     let suma = 0;
     while (contador < 10) {
        if (contador <= 1) {
            fib = contador;
        } else {
            fib = a + b;
            a = b;
            b = fib;
        }
        contador++;
        if (esPrimo(fib)) {
             primos++;
             console.log(fib);
             document.write("Es primo: " + fib + "<br>");
             suma = suma + fib;
        } else {
            console.log(fib);
            document.write( " No es primo: " + fib + "<br>");
        }
     function esPrimo(numero) {
            if (numero <= 1) {
             return false;
            }
            for (let i = 2; i < numero; i++) {
             if (numero % i == 0) {
                     return false;
                 }
                }
              return true;
        }   
    }
     document.write("La canidad de numeros primos son: " + primos + "<br>")
     document.write("La suma de los numeros primos es: " + suma + "<br>")
     document.write("el promedio de los numeros primos es: " + suma/primos + "<br>")
</script>
